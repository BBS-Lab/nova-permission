providers:
  - Laravel\Nova\NovaCoreServiceProvider
  - Spatie\Permission\PermissionServiceProvider
  - BBSLab\NovaPermission\NovaPermissionServiceProvider
  - Workbench\App\Providers\NovaServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: /nova
  # No auto-login `user:` — it re-authenticates on every request and would
  # override Nova impersonation. Log in manually (admin@laravel.com / password).
  build:
    - asset-publish
    - create-sqlite-db
    - db:wipe
    - migrate:refresh
  assets:
    - nova-assets
  sync:
    - from: ./workbench/config
      to: config
purge:
  directories:
    - lang/*
    - public/vendor/*
env:
  - AUTH_MODEL=Workbench\App\Models\User
  - CACHE_STORE=array
